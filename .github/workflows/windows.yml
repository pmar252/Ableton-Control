name: Windows app and tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Install build tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build portable Windows app
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name AbletonControl --add-data "remote_script/AbletonPromptBridge;remote_script/AbletonPromptBridge" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AbletonControl-Windows11
          path: dist/AbletonControl.exe
          retention-days: 30
